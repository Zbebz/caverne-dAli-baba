<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        {% block staticfiles %}{% endblock %}
        <title>{% block titre %}{% endblock %} Caverne d'Ali Baba</title>
    </head>
    <body>
        <nav class="bg-light border navbar navbar-expand-md navbar-light">
            <div class="container-fluid">
                <a class="navbar-brand fs-4" href="{% url 'index' %}">
                    Caverne d'Alibaba
                </a>
                <button
                    aria-controls="navbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                    class="navbar-toggler"
                    data-bs-target="#navbar"
                    data-bs-toggle="collapse"
                    type="button"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbar">
                    {% if user.is_authenticated %}
                        <ul class="navbar-nav w-100 mt-1">
                            <li class="nav-item me-auto">
                                <a class="nav-link" href="{% url 'logout' %}">Se déconnecter</a>
                            </li>
                            <li class="nav-item ms-auto">
                                <a class="btn btn-primary" href="{% url 'upload' %}">Publier</a>
                            </li>
                        </ul>
                    {% else %}
                    <ul class="navbar-nav me-auto mt-1">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'register' %}">S'inscrire</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'login' %}">Se connecter</a>
                        </li>
                    </ul>
                    {% endif %}
                </div>
            </div>
        </nav>
        <main class="p-5">
            {% block main %}{% endblock %}
        </main>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        {% block script %}{% endblock %}
    </body>
</html>
