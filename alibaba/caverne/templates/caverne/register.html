{% extends 'caverne/layout.html' %}
{% load static %}
{% block titre %} S'inscrire -{% endblock %}
{% block main %}
<form action="{% url 'register' %}" method="post">
    {% csrf_token %}
    <div class="d-flex flex-column justify-content-center">
        {% for field in form %}
        <div class="mb-3 mx-auto">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary w-auto">S'inscrire</button>
</form>
{% endblock %}
