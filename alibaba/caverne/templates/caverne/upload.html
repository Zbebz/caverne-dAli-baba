{% extends 'caverne/layout.html' %} {% block main %}
<style>
    #drop-area {
        width: 400px;
        height: 200px;
        margin: 20px auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 500px;
        max-width: 100%;
        height: 200px;
        border: 2px dashed #ccc;
        cursor: pointer;
    }

    #drop-area.drag-over {
        background-color: #eee;
    }

    .other-field {
        display: none;
    }
</style>
<form action="{% url 'upload' %}" method="post" enctype="multipart/form-data">
    {% csrf_token %} {% for field in form %}
    <div>
        {% if field == form.file %}
        <div id="file-field">
            <div id="drop-area">Choisissez votre fichier {{field}}</div>
        </div>
        {% else %}
        <div class="other-field">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endif %}
    </div>
    {% endfor %}
    <button type="submit">Submit</button>
</form>
<script>
    // https://uploadcare.com/blog/how-to-make-a-drag-and-drop-file-uploader/
    const dropArea = document.getElementById("drop-area");
    const fileInput = document.getElementById("id_file");
    const otherFields = document.querySelectorAll(".other-field");
    const fileField = document.getElementById("file-field");

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    dropArea.addEventListener("dragover", preventDefaults);
    dropArea.addEventListener("dragenter", preventDefaults);
    dropArea.addEventListener("dragleave", preventDefaults);

    dropArea.addEventListener("dragover", () => {
        dropArea.classList.add("drag-over");
    });

    dropArea.addEventListener("dragleave", () => {
        dropArea.classList.remove("drag-over");
    });

    dropArea.addEventListener("drop", (e) => {
        e.preventDefault();

        // Getting the list of dragged files
        const files = e.dataTransfer.files;

        if (files.length) {
            // Assigning the files to the hidden input from the first step
            fileInput.files = files;

            otherFields.forEach((f) => {
                f.style.display = "initial";
            });
            fileField.style.display = "none";
        }
    });

    // https://developer.mozilla.org/en-US/docs/Web/API/File_API/Using_files_from_web_applications#using_hidden_file_input_elements_using_the_click_method
    dropArea.addEventListener("click", (e) => {
        fileInput.click();
    });
</script>
{{ form.errors }} {% endblock %}
